name: SecretShield Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SecretShield
        run: |
          python src/main.py .
      # 5. Upload the HTML Report as an Artifact
      # 'if: always()' ensures this runs even if the previous step failed (found secrets)
      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SecretShield-Report
          path: security_report.html
          retention-days: 5

